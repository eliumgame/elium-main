name: Elium CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Droits minimaux par défaut (lecture du dépôt uniquement) ; aucun job de CI n'écrit.
permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies (verrou à hashes)
      run: |
        python -m pip install --upgrade pip
        # requirements/dev.txt : versions ET hashes figés (uv pip compile --universal --generate-hashes).
        pip install --require-hashes -r requirements/dev.txt
        echo "PYTHONPATH=$PWD/src" >> "$GITHUB_ENV"
    - name: Lint with ruff
      run: ruff check src/ tests/ installer/ security/ scripts/
    - name: Run Pytest with coverage
      run: |
        pytest tests/python -v --cov=elium --cov-report=term-missing
    - name: Audit des dépendances Python EMBARQUÉES (pip-audit, exceptions datées)
      # Même principe que l'audit npm : toute faille connue des dépendances d'exécution (ce qui est
      # réellement livré) bloque, sauf les exceptions DATÉES et justifiées de scripts/pip_audit_gate.py.
      run: python scripts/pip_audit_gate.py requirements/runtime.txt
    - name: Audit des outils de développement (informatif)
      # Outils de test/lint (pytest, pip, filelock…) : jamais livrés. On les signale sans bloquer ;
      # les relever est l'affaire de Dependabot / d'une recompilation du verrou.
      continue-on-error: true
      run: python scripts/pip_audit_gate.py requirements/dev.txt

  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
    - name: Syntaxe + shellcheck (install.sh, logique de déploiement non testable unitairement)
      run: |
        bash -n install.sh
        # shellcheck est préinstallé sur les runners ubuntu-latest.
        shellcheck --severity=warning install.sh

  compose-config:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
    - name: docker compose config (secrets obligatoires, interpolation valide)
      run: |
        # Doit ÉCHOUER sans secrets (fail fast) ...
        if docker compose config >/dev/null 2>&1; then echo "::error::docker compose accepte une config SANS secrets"; exit 1; fi
        # ... et réussir avec.
        POSTGRES_PASSWORD=x TOKEN_SECRET=y CORS_ORIGINS=http://localhost S3_SECRET_KEY=z REDIS_PASSWORD=w docker compose config >/dev/null

  web-studio-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
      with:
        node-version-file: '.node-version'
    - name: Set up Python (tests d'interop Python <-> Web)
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.12'
    - name: Install elium (Python) pour l'interop
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements/runtime.txt
        echo "PYTHONPATH=$PWD/src" >> "$GITHUB_ENV"
    - name: Install dependencies
      working-directory: ./web-studio
      run: npm ci
    - name: Lint (ESLint)
      working-directory: ./web-studio
      run: npm run lint
    - name: Format check (Prettier)
      working-directory: ./web-studio
      run: npm run format:check
    - name: Build Web Studio
      working-directory: ./web-studio
      run: npm run build
    - name: Budget de bundle (régression de taille)
      working-directory: ./web-studio
      run: npm run check:bundle-budget
    - name: Run Web Studio Tests
      working-directory: ./web-studio
      run: npm test
    - name: Install Chromium (Playwright, pour axe-core)
      working-directory: ./web-studio
      run: npx playwright install --with-deps chromium
    - name: Tests navigateur (axe-core + parcours utilisateur réels)
      working-directory: ./web-studio
      run: npm run test:browser
    - name: Audit dépendances de production
      working-directory: ./web-studio
      # Même exigence que `npm audit --audit-level=high`, sauf les exceptions datées et
      # justifiées de scripts/audit-gate.mjs (node-forge : aucun correctif publié).
      run: node scripts/audit-gate.mjs

  server-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
      with:
        node-version-file: '.node-version'
    - name: Install dependencies
      working-directory: ./server
      # `npm ci` (strict, comme partout ailleurs) : échoue si package-lock.json
      # dérive, au lieu de le réécrire silencieusement comme `npm install`.
      run: npm ci
    - name: Lint (ESLint)
      working-directory: ./server
      run: npm run lint
    - name: Format check (Prettier)
      working-directory: ./server
      run: npm run format:check
    - name: Typecheck
      working-directory: ./server
      run: npm run typecheck
    - name: Test (Vitest)
      working-directory: ./server
      run: npm test
    - name: Audit dépendances de production
      working-directory: ./server
      run: npm audit --omit=dev --audit-level=high

  server-e2e:
    runs-on: ubuntu-latest
    # Intégration lourde (Postgres embarqué + Fastify réel). Repassé bloquant le
    # 2026-08-18 après avoir vérifié 5/5 exécutions vertes (3 runs CI Ubuntu réels
    # dont un après la migration Fastify v5, + 2 runs locaux Windows), 136/136
    # vérifications à chaque fois. Risque résiduel connu : le téléchargement de
    # libicu60 ci-dessous dépend des miroirs archive.ubuntu.com — une panne réseau
    # ferait échouer le job pour une raison sans rapport avec le code. Si ça devient
    # source de flakiness, vendoriser le .deb ou passer par Docker plutôt que de
    # redevenir non bloquant.
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
    - name: Installer libicu60 (dép. runtime du Postgres embarqué)
      run: |
        curl -fsSL -o /tmp/libicu60.deb \
          http://archive.ubuntu.com/ubuntu/pool/main/i/icu/libicu60_60.2-3ubuntu3.2_amd64.deb \
        || curl -fsSL -o /tmp/libicu60.deb \
          http://archive.ubuntu.com/ubuntu/pool/main/i/icu/libicu60_60.2-3ubuntu3_amd64.deb
        sudo dpkg -i /tmp/libicu60.deb || sudo apt-get -f install -y
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
      with:
        node-version-file: '.node-version'
    - name: Install server dependencies
      working-directory: ./server
      run: npm ci
    - name: Install Web Studio dependencies
      working-directory: ./web-studio
      run: npm ci
    - name: Run multi-user E2E (embedded Postgres, real Fastify app, real SDK)
      working-directory: ./web-studio
      run: npm run test:e2e
    - name: Run collaborative Tableur E2E (embedded Postgres, real WS relay, 2 clients)
      working-directory: ./web-studio
      run: npm run test:e2e:sheet
