name: Elium — Publication auto (push master)

# Modèle « dès que je push, ça se met à jour » : chaque push sur master
# construit l'app Windows, signe le manifeste et publie une GitHub Release. Les apps
# installées la récupèrent automatiquement. Aucun tag manuel.
#
# Déclenchement — CE workflow ne démarre PLUS directement sur push : un commit qui
# casse un test Vitest/lint/a11y/serveur mais compile aurait pu être publié et
# auto-distribué à toute la base installée en ne passant QUE pytest. Il attend
# désormais la fin du workflow "Elium CI" (.github/workflows/ci.yml, qui lui
# tourne sur push comme avant) et vérifie, dans le job "gate" ci-dessous :
#   - que c'est bien CE workflow CI référencé par son NOM ("Elium CI") qui vient
#     de tourner (déclenchement `workflow_run`) ;
#   - que sa conclusion est EXACTEMENT "success" (pas "failure"/"cancelled") ;
#   - que la branche testée (`head_branch`) est bien `master` (écarte les runs CI
#     déclenchés par une pull_request depuis une autre branche) ;
#   - que le dépôt source du run CI est bien CE dépôt (écarte un run CI d'un fork).
# Tout le reste du job (checkout, build, signature, publication) s'exécute alors
# sur le SHA EXACT (`head_sha`) qui a été testé par CI — jamais un autre commit.
# `workflow_dispatch` reste un contournement MANUEL volontaire (republication
# d'urgence) qui ne repasse pas par ce contrôle CI — mais le gate exige quand
# même que ce déclenchement manuel vise `master` (`github.ref ==
# refs/heads/master`) : un lancement accidentel depuis l'UI Actions sur une
# branche de feature ou un vieux commit est refusé, pas publié sans aucune
# vérification.
#
# Pré-requis (une seule fois) :
#   - Repo PUBLIC (sinon les utilisateurs ne peuvent pas télécharger les assets).
#   - Secret de dépôt UPDATE_SIGNING_KEY = clé privée Ed25519 (fichier update-private-key.hex).
#     Tant qu'il est absent, ce workflow s'exécute mais NE PUBLIE PAS (run vert, pas d'échec).

on:
  workflow_run:
    workflows: ["Elium CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # crée/met à jour l'issue de suivi si le health-check post-publication échoue

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Vérifier le déclencheur (CI verte sur ce commit master, ou déclenchement manuel)
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.ref }}" = "refs/heads/master" ]; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
              echo "Déclenchement manuel (workflow_dispatch) sur master — contrôle CI volontairement contourné."
            else
              echo "ok=false" >> "$GITHUB_OUTPUT"
              echo "sha=" >> "$GITHUB_OUTPUT"
              echo "::warning title=Publication ignorée::Déclenchement manuel (workflow_dispatch) effectué depuis '${{ github.ref_name }}', pas 'master' — le contournement d'urgence n'est autorisé que depuis master, publication refusée."
              echo "### ⛔ Publication ignorée — workflow_dispatch doit être lancé depuis master (branche/ref sélectionnée : ${{ github.ref_name }})" >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "${{ github.event_name }}" = "workflow_run" ] \
            && [ "${{ github.event.workflow_run.conclusion }}" = "success" ] \
            && [ "${{ github.event.workflow_run.head_branch }}" = "master" ] \
            && [ "${{ github.event.workflow_run.head_repository.full_name }}" = "${{ github.repository }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "Elium CI réussi sur master @ ${{ github.event.workflow_run.head_sha }} — publication autorisée."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "::warning title=Publication ignorée::Elium CI n'a pas terminé en succès sur master pour ce commit (event=${{ github.event_name }}, conclusion=${{ github.event.workflow_run.conclusion }}, branche=${{ github.event.workflow_run.head_branch }})."
            echo "### ⛔ Publication ignorée — Elium CI n'est pas vert sur ce commit master" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          # SHA exact validé par le gate ci-dessus (jamais un autre commit qui
          # aurait pu atterrir sur master entre la fin de CI et ce run).
          ref: ${{ steps.gate.outputs.sha }}
          # Historique ET tags complets : installer/changelog.py dérive les
          # nouveautés de `git log <tag précédent>..HEAD`. Un checkout
          # superficiel (le défaut) donnerait une liste vide, donc une carte de
          # mise à jour muette sur ce qu'elle apporte.
          fetch-depth: 0

      - name: Vérifier le secret de signature
        id: guard
        if: steps.gate.outputs.ok == 'true'
        shell: bash
        env:
          KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UPDATE_SIGNING_KEY absent — publication ignorée (ajoute le secret pour activer l'auto-update)."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lire la version exacte de src/elium/__init__.py
        if: steps.guard.outputs.has_key == 'true'
        id: ver
        shell: bash
        run: |
          # Version sémantique = le __version__ EXACT de __init__.py. Bumpez-le
          # pour publier une nouvelle release (une re-push sans bump est un no-op,
          # voir l'étape « Publier » ci-dessous).
          VER=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' src/elium/__init__.py | head -1)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.has_key == 'true'
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.has_key == 'true'
        with:
          node-version: '24'

      - name: Installer les dépendances Python
        if: steps.guard.outputs.has_key == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Stamper la version + le code hash
        if: steps.guard.outputs.has_key == 'true'
        run: python installer/stamp_version.py "${{ steps.ver.outputs.version }}"

      - name: Tests Python (garde-fou)
        if: steps.guard.outputs.has_key == 'true'
        run: pytest tests/python -q

      - name: Builder le Web Studio
        if: steps.guard.outputs.has_key == 'true'
        working-directory: web-studio
        run: |
          npm ci
          npm run build

      - name: Builder Elium.exe (PyInstaller one-file)
        if: steps.guard.outputs.has_key == 'true'
        run: python -m PyInstaller installer/elium.spec --noconfirm --distpath installer/staging --workpath installer/build

      - name: Empaqueter web.zip
        if: steps.guard.outputs.has_key == 'true'
        shell: pwsh
        run: Compress-Archive -Path web-studio/dist/* -DestinationPath web.zip -Force

      - name: Builder le MSI (WiX 3 — best-effort)
        if: steps.guard.outputs.has_key == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wix = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path $wix)) { $wix = Join-Path $env:WIX 'bin' }
          New-Item -ItemType Directory -Force -Path installer/output, installer/build | Out-Null
          & "$wix\candle.exe" -nologo -arch x64 -out installer/build/elium.wixobj installer/elium.wxs
          & "$wix\light.exe" -nologo -cultures:fr-FR -ext WixUIExtension -ext WixUtilExtension `
              -b installer -out "installer/output/Elium-${{ steps.ver.outputs.version }}-Setup.msi" `
              installer/build/elium.wixobj

      - name: Générer et signer le manifeste
        if: steps.guard.outputs.has_key == 'true'
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          # Nécessaire pour relire le manifeste de la release précédente.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          MSI="installer/output/Elium-${V}-Setup.msi"
          # Historique des nouveautés : on récupère d'abord le manifeste DÉJÀ
          # publié pour empiler dessus, sinon la carte de mise à jour ne pourrait
          # annoncer que la dernière version au lieu de tout ce que l'utilisateur
          # n'a pas encore. Best-effort : une première release n'a pas de passé.
          gh release download --pattern latest.json --dir prev -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          PREV=""
          if [ -f prev/latest.json ]; then PREV="--prev-manifest prev/latest.json"; fi
          # La liste des nouveautés est un CONFORT : si elle échoue, la mise à
          # jour doit rester publiable, seules les notes détaillées manquent.
          # `set -e` est actif, d'où le `||` explicite — sans lui, un changelog
          # en échec emporte toute la publication.
          mkdir -p dist
          python installer/changelog.py --version "$V" --out dist/changelog.json $PREV \
            || echo "::warning::changelog indisponible — manifeste publié sans notes détaillées"
          # SHA du commit gate ci-dessus (validé par CI, checkouté explicitement),
          # PAS github.sha : sur un déclenchement workflow_run, github.sha désigne
          # le HEAD de master au moment de CE run, qui peut différer (course avec
          # un push ultérieur) du commit qui a réellement été testé.
          ARGS=(--version "$V" --commit "${{ steps.gate.outputs.sha }}" --exe installer/staging/Elium.exe --web web.zip --out dist --notes "Elium $V")
          if [ -f dist/changelog.json ]; then ARGS+=(--changelog-file dist/changelog.json); fi
          if [ -f "$MSI" ]; then ARGS+=(--msi "$MSI"); fi
          python installer/gen_manifest.py "${ARGS[@]}"

      - name: Publier la GitHub Release
        if: steps.guard.outputs.has_key == 'true'
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          MSI="installer/output/Elium-${V}-Setup.msi"
          ASSETS=(installer/staging/Elium.exe web.zip dist/latest.json dist/latest.json.sig)
          if [ -f "$MSI" ]; then ASSETS+=("$MSI"); fi
          if gh release view "v${V}" >/dev/null 2>&1; then
            # Avertissement et non simple notice : un job vert sans release
            # publiée est exactement le cas qui passe inaperçu.
            echo "::warning title=Aucune release publiée::v${V} existe déjà. Bumpez __version__ dans src/elium/__init__.py (ou lancez installer/stamp_version.py X.Y.Z) pour publier."
            echo "### ⚠️ Aucune release publiée — v${V} existe déjà" >> "$GITHUB_STEP_SUMMARY"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "v${V}" "${ASSETS[@]}" \
            --target "${{ steps.gate.outputs.sha }}" \
            --title "Elium ${V}" \
            --generate-notes
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Vérifier la présence du MSI (alerte si absent)
        # L'étape WiX est en continue-on-error (best-effort, cf. son commentaire) :
        # si elle échoue, l'asset MSI est simplement omis de la release SANS que
        # rien ne le signale ailleurs que dans les logs de cette étape précise —
        # contrairement au changelog manquant, qui a déjà son propre `::warning::`
        # ci-dessus. Cette étape rend l'omission visible au même endroit (résumé du
        # job), que la release ait été publiée ou non (no-op inclus).
        if: steps.guard.outputs.has_key == 'true'
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          MSI="installer/output/Elium-${V}-Setup.msi"
          if [ -f "$MSI" ]; then
            echo "  [ok]   $MSI présent"
          else
            echo "::warning title=MSI absent::Le build WiX (best-effort, continue-on-error) a échoué ou n'a produit aucun installeur — v${V} est publiée SANS MSI (exe + web uniquement). Voir les logs de l'étape « Builder le MSI » ci-dessus pour la cause."
            echo "### ⚠️ MSI absent pour v${V} — build WiX échoué, release sans installeur MSI" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Vérifier la publication (health-check post-release)
        # Ne tourne QUE si une release a été VRAIMENT publiée à l'étape
        # précédente (pas sur le no-op "v${V} existe déjà").
        if: steps.guard.outputs.has_key == 'true' && steps.publish.outputs.published == 'true'
        shell: bash
        env:
          V: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # ------------------------------------------------------------- #
          # Décision : PAS de rollback automatique (pas de `gh release
          # delete`) sur un health-check en échec. Alerte visible + job en
          # échec, décision humaine ensuite. Pourquoi :
          #
          #  1. Faux positifs plausibles et coûteux à masquer par un rollback
          #     silencieux : verify_release.py retélécharge les assets à
          #     peine publiés, une propagation CDN incomplète peut le faire
          #     échouer sur une release en réalité saine (le même phénomène,
          #     côté disponibilité, que la course de résolution de tag
          #     corrigée en 4cf9654 — verify_release.py absorbe une partie du
          #     risque avec ses propres reprises espacées, mais pas la
          #     totalité). Supprimer automatiquement détruirait une bonne
          #     release à cause d'un blip transitoire.
          #  2. Risque en vol : un poste utilisateur peut avoir déjà commencé
          #     à télécharger cette release au moment où un rollback
          #     automatique la supprimerait — casser une mise à jour qui
          #     aurait pu réussir est pire que la laisser en place.
          #  3. Le design côté client absorbe déjà l'essentiel du risque d'une
          #     release réellement cassée : signature Ed25519 + sha256
          #     vérifiés avant toute écriture, et « le moindre échec =>
          #     artefact jeté, l'app continue sur la version courante. Jamais
          #     de crash. » (installer/updater.py, en-tête du module). Une
          #     release cassée reste donc seulement non installable jusqu'à
          #     correction — elle ne met personne en danger.
          #  4. Une suppression automatique de release est une action
          #     destructrice, difficile à annuler proprement (le tag redevient
          #     réutilisable, source de confusion) et déclenchée sans
          #     supervision humaine — le pire moment pour improviser.
          #
          # Donc : échec => `::warning::` explicite + step en échec (run rouge,
          # notifications sur push) pour qu'un humain inspecte et choisisse
          # (rollback manuel via le bouton client existant, suppression
          # manuelle de la release, ou publication corrective) — jamais
          # d'action automatique sur la release elle-même.
          # ------------------------------------------------------------- #
          if python installer/verify_release.py "$V"; then
            echo "### ✅ Health-check post-publication OK pour v${V}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Health-check post-publication échoué::La release v${V} a été publiée mais son manifeste/ses assets n'ont pas pu être re-vérifiés après coup (signature/sha256/disponibilité). ROLLBACK NON AUTOMATIQUE : inspectez les logs de ce job et décidez (rollback manuel, suppression manuelle, ou republication)."
            echo "### ❌ Health-check post-publication ÉCHOUÉ pour v${V} — rollback NON automatique, décision manuelle requise" >> "$GITHUB_STEP_SUMMARY"

            # ----------------------------------------------------------- #
            # Visibilité HORS de l'onglet Actions, sans secret supplémentaire :
            # ouvre (ou commente, si une est déjà ouverte) une issue GitHub dédiée
            # via le GITHUB_TOKEN par défaut (permissions.issues: write ci-dessus).
            # `gh label create --force` est idempotent : crée le label la première
            # fois, ne fait rien d'observable les fois suivantes.
            # ----------------------------------------------------------- #
            gh label create "release-health-check-failed" \
              --color "B60205" \
              --description "Health-check post-publication d'une release Elium en échec (voir release.yml)" \
              --force || true
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            BODY=$(printf '%s\n\n%s' \
              "Le health-check post-publication a échoué pour **v${V}** (workflow release.yml, [run #${{ github.run_id }}](${RUN_URL}))." \
              "ROLLBACK NON automatique : voir les logs du run ci-dessus pour la raison précise (signature/sha256/disponibilité), puis décider — rollback manuel via le bouton client existant, suppression manuelle de la release, ou republication corrective.")
            EXISTING=$(gh issue list --label "release-health-check-failed" --state open --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY" || true
            else
              gh issue create \
                --title "Health-check de publication en échec — v${V}" \
                --label "release-health-check-failed" \
                --body "$BODY" || true
            fi
            exit 1
          fi
