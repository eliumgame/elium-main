# =============================================================================
# Elium Drive Entreprise — single-VPS deployment.
#   caddy (TLS edge) -> web (static SPA) + api (Fastify REST + WS relay)
#   api -> db (Postgres) + blobs volume (encrypted content at rest via LUKS)
# All content, file names and keys stored here are ciphertext (E2E). See
# la Documentation. Copy deploy/.env.example to .env before `docker compose up`
# (ou lancez `bash install.sh drive`, qui génère tous les secrets).
#
# SECRETS OBLIGATOIRES : plus aucun mot de passe par défaut. Un secret absent de .env fait
# échouer `docker compose` immédiatement (fail fast), au lieu de démarrer avec « elium ».
#
# IMAGES : `api` et `web` se construisent sur place (`up -d --build`) OU se tirent, épinglées
# par DIGEST signé, depuis GHCR : install.sh auto-update écrit ELIUM_API_IMAGE / ELIUM_WEB_IMAGE
# (références `ghcr.io/…@sha256:…` lues dans le manifeste signé) puis lance `up -d --no-build`.
# =============================================================================
services:
  db:
    # Tag + digest : le digest fait foi (reproductible), le tag est lisible. Bump via dependabot.
    image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    environment:
      POSTGRES_USER: elium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: elium
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elium -d elium"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Idempotent : prépare aussi les bases antérieures où elium possédait les tables.
  # L'API ne reçoit jamais le mot de passe du superutilisateur.
  db-init:
    image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: elium
      PGDATABASE: elium
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    volumes:
      - ./deploy/init-app-role.sql:/init-app-role.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/init-app-role.sql"]

  api:
    image: ${ELIUM_API_IMAGE:-elium-api:local}
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # Deployed version (written to .env by install.sh from src/elium/__init__.py);
      # surfaced at /api/health so the auto-updater can confirm what is running.
      ELIUM_VERSION: ${ELIUM_VERSION:-dev}
      HOST: 0.0.0.0
      PORT: "8787"
      DATABASE_URL: postgres://elium_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@db:5432/elium
      TOKEN_SECRET: ${TOKEN_SECRET:?Set a strong TOKEN_SECRET in .env}
      # Portail du propriétaire : un déploiement = un Drive ; OWNER_EMAIL (optionnel) réserve
      # l'inscription du premier compte (le propriétaire) à cette adresse.
      SINGLE_DRIVE: ${SINGLE_DRIVE:-true}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      # Code d'activation à usage unique du premier démarrage (vide = généré et affiché dans les journaux).
      ACTIVATION_CODE: ${ACTIVATION_CODE:-}
      ACTIVATION_TTL_HOURS: ${ACTIVATION_TTL_HOURS:-72}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env (your site origin, e.g. https://drive.example.com)}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Elium Drive}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      WS_ALLOW_QUERY_TOKEN: ${WS_ALLOW_QUERY_TOKEN:-false}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      # Storage: "fs" (blobs volume) by default, or "s3" to use the MinIO service
      # below (start it with: docker compose --profile s3 up -d).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
      STORAGE_FS_ROOT: /data/blobs
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-elium-blobs}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-elium}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_FORCE_PATH_STYLE: "true"
      # Collab backplane: cross-instance pub/sub relay + shared rate-limiting
      # (server/src/collab/backplane.ts). Le Redis intégré est protégé par mot de passe ;
      # pour un Redis EXTERNE, définissez REDIS_URL complet dans .env (il prime).
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379}
    volumes:
      - blobs:/data/blobs
    healthcheck:
      # wget ships with BusyBox in the node:alpine base image, no extra
      # package required.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional S3-compatible object storage. Enable with STORAGE_DRIVER=s3 and
  # `docker compose --profile s3 up -d`. Create the bucket once (mc / console).
  minio:
    # L'image communautaire historique n'est plus distribuée ni maintenue.
    # L'opérateur doit fournir une image maintenue et vérifiée par digest.
    image: ${MINIO_IMAGE:-minio-unconfigured:invalid}
    profiles: ["s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-elium}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Backplane for horizontal scale-out: cross-instance pub/sub relay + shared
  # rate-limiting. Désormais PROTÉGÉ par mot de passe (aucun port publié, mais un conteneur
  # compromis du même réseau ne doit pas pouvoir y lire/écrire librement). Only holds pub/sub
  # messages + rate-limit counters, both fine to lose on restart: no persistent volume.
  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    # Le mot de passe passe par l'environnement du conteneur (pas par la ligne de commande,
    # visible dans `ps`).
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]

  web:
    image: ${ELIUM_WEB_IMAGE:-elium-web:local}
    build:
      context: ./web-studio
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    # Serveur statique NON root (écoute 8080), système de fichiers en lecture seule.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    # Tag + digest (voir plus haut).
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Caddy refuse « email » sans argument : une valeur factice évite l'échec au démarrage quand aucun e-mail n'est fourni.
      ACME_EMAIL: ${ACME_EMAIL:-noreply@localhost.invalid}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./release:/srv/elium-release:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  blobs:
  miniodata:
  caddy_data:
  caddy_config:
